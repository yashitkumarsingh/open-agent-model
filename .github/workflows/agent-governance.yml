name: OpenAgentModel Governance Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  governance-scan:
    name: Auditing Agent Security & Topology
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript Compiler
        run: npm run build

      - name: 1. Validate Model Syntax & Referential Linker
        run: |
          echo "Verifying syntax and resolving internal references..."
          node dist/index.js validate -i agentmodel.yaml

      - name: 2. Enforce Security Risk Gate (Success Path)
        # Verify that our secure model file compiles and passes with exit code 0.
        run: |
          echo "Scanning secure agent topology for OWASP Agentic vulnerabilities..."
          node dist/index.js risk -i agentmodel.yaml --fail-on high --sarif agent-risks.sarif

      - name: 3. Verify Risk Scanner Detects Insecure Models (Failure Path)
        # Verify that our insecure test model is correctly flagged and fails the gate.
        # We invert the exit code using bash '!' so that the CI step passes when
        # the risk engine successfully identifies the threat and returns code 1.
        run: |
          echo "Asserting that the risk engine blocks insecure topologies..."
          ! node dist/index.js risk -i examples/dodgy-agent.yaml --fail-on high

      - name: 4. Compile Visual Maps & Governance Packs
        run: |
          echo "Compiling vector diagrams and HTML report dashboard..."
          node dist/index.js report -i agentmodel.yaml -d governance-pack/

      - name: Upload Security SARIF Log
        uses: actions/upload-artifact@v4
        with:
          name: oam-security-sarif
          path: agent-risks.sarif

      - name: Upload Governance Pack (Visual Maps & Reports)
        uses: actions/upload-artifact@v4
        with:
          name: oam-governance-reports
          path: governance-pack/
