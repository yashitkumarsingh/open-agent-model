# OpenAgentModel Dodgy Test Configuration
# This file is intentionally insecure and is used by CI/CD to verify that the static risk engine
# correctly blocks hazardous agent designs (e.g. unapproved tools, infinite loops).
system: dodgy-agent-system
version: "0.1"

agents:
  - id: triage-agent
    purpose: "Analyze patient symptom descriptions and recommend scheduling slots."
    framework: crewai
    autonomy: supervised
    memory:
      type: vector
      contains:
        - patient_symptoms
      write_access: true
      poisoning_protection: false # Violation: Missing poisoning protection
    allowed_tools:
      - query-symptom-db
      - read-patient-chart
    allowed_delegates:
      - clinical-diagnostician # Violation: Delegation escalation path
    retry_policy:
      max_retries: 20 # Violation: Excessive retries
      loop_detection: false # Violation: Missing loop tracking
    spend_limit:
      max_cost_usd: 0.5
      time_window: 1h

  - id: clinical-diagnostician
    purpose: "Diagnose conditions and recommend clinical prescriptions."
    framework: langgraph
    autonomy: human-approval-required
    allowed_tools:
      - query-symptom-db
      - prescribe-medication
    approval_required_for:
      - prescribe-medication

tools:
  - id: query-symptom-db
    type: api
    description: "Fetch matching symptoms from medical lookup tables."
    risk: low

  - id: read-patient-chart
    type: database
    description: "Fetch HIPAA sensitive medical histories."
    data_classes: [patient_health_records]
    risk: high

  - id: prescribe-medication
    type: api
    description: "Issue prescription orders to pharmacy networks."
    risk: critical
    requires_human_approval: true

mcp_servers:
  - id: hospital-ehr-mcp
    trust_level: internal
    exposes:
      - read-patient-chart

  - id: external-pharmacy-mcp
    trust_level: external
    exposes:
      - prescribe-medication

data_classes:
  - id: patient_symptoms
    sensitivity: high
    classification: pii

  - id: patient_health_records
    sensitivity: critical
    classification: pii

policies:
  - "max_cost_per_task_usd: 0.50"
  - "max_tool_calls_per_task: 15"
  - "no_external_mcp_can_access_payment_tokens"
