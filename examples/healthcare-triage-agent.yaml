# OpenAgentModel Healthcare Triage Reference
system: healthcare-triage-agent
version: "1.0"

agents:
  - id: patient-triage-agent
    purpose: "Interviews patient on symptoms, runs primary medical lookup, and recommends scheduling slots."
    framework: crewai
    autonomy: supervised
    memory:
      type: vector
      contains: [patient_symptoms]
      write_access: true
      poisoning_protection: false # Triggers memory poisoning warning!
    allowed_tools:
      - query-medical-kb
      - send-triage-summary
    allowed_delegates:
      - clinic-scheduler-agent # A2A delegation path
    retry_policy:
      max_retries: 5
      loop_detection: true

  - id: clinic-scheduler-agent
    purpose: "Accesses doctor schedules and books direct slots."
    framework: langgraph
    autonomy: autonomous # Triggers warning: books slots autonomously without approval!
    allowed_tools:
      - query-doctor-schedule
      - book-appointment-slot
    spend_limit:
      max_cost_usd: 0.10

tools:
  - id: query-medical-kb
    type: api
    description: "Search local medical symptoms database."
    risk: low

  - id: send-triage-summary
    type: api
    description: "Send symptoms summary to primary care provider inbox."
    data_classes: [patient_pii, patient_health_record]
    risk: medium

  - id: query-doctor-schedule
    type: api
    description: "Lookup doctor schedules and slot availability."
    risk: low

  - id: book-appointment-slot
    type: api
    description: "Inserts a calendar reservation for patient."
    data_classes: [patient_pii]
    risk: medium # Writing tool, should have approval gate in healthcare

mcp_servers:
  - id: internal-emr-mcp
    trust_level: internal
    exposes:
      - send-triage-summary

data_classes:
  - id: patient_pii
    sensitivity: high
    classification: pii

  - id: patient_health_record
    sensitivity: critical
    classification: pii # Classified as PII/HIPAA data

policies:
  - "hippa_data_must_not_exfiltrate_to_external_servers"
  - "all_patient_record_writes_require_mfa_auditing"
